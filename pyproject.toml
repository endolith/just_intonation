[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "just_intonation"
version = "0.1.0"
description = "Classes for Just intonation music theory experiments"
readme = "README.md"
requires-python = ">=3.7"
authors = [
    { name = "endolith", email = "endolith@gmail.com" },
]
keywords = ["music", "just intonation", "xenharmonic", "microtonal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/endolith/just_intonation"
Repository = "https://github.com/endolith/just_intonation"
Issues = "https://github.com/endolith/just_intonation/issues"

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
]
midi = [
    "numpy>=1.19",
    "pygame>=2.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["just_intonation.py"]
