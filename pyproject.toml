[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "just_intonation"
version = "0.1"
description = "Classes for Just intonation music theory experiments"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "endolith", email = "endolith@gmail.com" }]
dependencies = []
urls = { Homepage = "https://github.com/endolith/just_intonation" }

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "flake8>=7",
]
midi = [
    "numpy>=2",
    "pygame>=2.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["just_intonation.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/just_intonation.py",
    "/pyproject.toml",
    "/README.md",
    "/test_just_intonation.py",
    "/midi_play.py",
    "/.coveragerc",
    "/.github/workflows/python-package.yml",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules --ignore-glob=midi_play.py --cov --cov-report=html --tb=short"
